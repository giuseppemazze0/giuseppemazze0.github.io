<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script defer src="scripts/main.js"></script>
    <title>Document</title>
</head>
<body>
    <header>
        <section id="inventario">
            <div id="inventario-moeda">
                <img src="images/moeda.webp" alt="Moeda">
                <p>x<span id="moedas">0</span></p>
            </div>
            <div id="inventario-rato">
                <img src="images/rato-parado.webp" alt="Um rato">
                <p>x<span id="ratos">0</span></p>
            </div>
        </section>
    </header>
    <main>
        <section id="container-balcao">
            <img id="balcao" src="images/balcao-rpg.png" alt="Balcão de rpg">
            <abbr title="Capturar rato">
                <img id="rato" src="images/rato-parado.webp" alt="Um rato">
            </abbr>
        </section>

        <section id="container-garconete">
            <abbr title="Conversar com a garçonete">
                <img id="garconete" src="images/garconete.png" alt="Garçonete de RPG">
                
            </abbr>
            <div>
                <p></p>
                <button id="regras">Regras</button>
                <button id="avancar">Avançar</button>
            </div>
        </section>
    
        <section id="container-bebida">
            <abbr title="Garrafa de Coca-Cola">
                <img id="coca-cola" src="images/coca-cola.png" alt="Garrafa de Coca-Cola">
            </abbr>
            <abbr title="Copo de Cerveja">
                <img id="cerveja" src="images/cerveja.png" alt="Copo de Cerveja">
            </abbr>
            <abbr title="Bebida Misteriosa">
                <img id="bebida-misteriosa" src="images/pocao-minecraft.png" alt="Bebida Misteriosa">
            </abbr>
        </section>

        <section id="container-cachorro">
            <abbr title="Fazer carinho no Rex">
                <img id="cachorro" src="images/cachorro.png" alt="Um cachorro">
                <img id="coracoes" src="images/coracoes.webp" alt="3 corações">
            </abbr>
        </section>
    </main>
</body>
</html>
