<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="script/main.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <title>Giuseppe Mazzeo</title>
</head>
<body>
    <header>
        <a href="../index.html">Voltar</a>
    </header>

    <section>
        <ol>
            <li>
                <p id="passaPorCima">Passa por aqui!</p>
            </li>
            <li id="li_buttons">
                <p id="pinta">Pinte-me!</p>
                <button data-color="red">Vermelho</button>
                <button data-color="green">Verde</button>
                <button data-color="blue">Azul</button>
            </li>
            <li>
                <label for="mudaCorFundoInput">Experimenta escrever...</label>
                <input id="mudaCorFundoInput" type="text">
            </li>
            <li>
                <label for="mudaCorFundoBody">Escolha uma cor em inglês:</label>
                <input id="mudaCorFundoBody" type="text">
                <input id="submit" type="submit">
            </li>
            <li>
                <button id="contador">Conta!</button>
                <span id="contagem"></span>
            </li>
        </ol>
        <ol>
            <li>
                <label for="mudaCorFundoBodySelect">Escolha uma cor...</label>
                <select id="mudaCorFundoBodySelect">
                    <option value="white">Padrão</option>
                    <option value="red">Vermelho</option>
                    <option value="green">Verde</option>
                    <option value="blue">Azul</option>
                </select>
            </li>
            <li>
                <form id="form">
                    <input id="nome" type="text" placeholder="Nome">
                    <input id="idade" type="number" placeholder="Idade" >
                    <input id="submitNomeEIdade" type="submit">
                </form>
                <p id="mostrarTexto"></p>
            </li>
            <li>
                <p>Automatic Counter:</p>
                <span id="contadorAutomatico">0</span>
            </li>
        </ol>
    </section>

    <footer>
        <p>Universidade Lusófona © 2025</p>
        <p>Desenvolvimento de Interfaces Web</p>
        <p>Giuseppe Mazzeo</p>
    </footer>
</body>
</html>
